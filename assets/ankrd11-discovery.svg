<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">ANKRD11 condensates restrain excessive transcription</title>
  <desc id="desc">ANKRD11 forms condensates at hypertranscribed genes, restrains transcriptional elongation, and helps safeguard gene regulation during development. Transcription continues in the final drawing; restraint does not mean complete silencing. These drawings summarize a mechanism and are not measurements of condensate size, transcription rate, or gene output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 6 4 1 7" fill="none" stroke="#1B675A" stroke-width="1.3"/></marker>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="101" cy="99" rx="90" ry="69" fill="#e9eee5" stroke="#1B675A" stroke-width="2" stroke-dasharray="4 6"/>
    <path d="M12 137H190 M265 137H438 M516 137H704" stroke="#788679" stroke-width="2"/>
    <path d="M47 119H128L149 137 128 155H47Z" fill="#e1e8dd" stroke="#1B675A" stroke-width="2"/>
    <g fill="#1B675A" stroke="#1B675A" stroke-width="2">
      <circle cx="51" cy="85" r="7"/>
      <circle cx="79" cy="57" r="7"/>
      <circle cx="124" cy="57" r="7"/>
      <circle cx="151" cy="85" r="7"/>
    </g>
    <path d="M285 119H394L416 137 394 155H285Z" fill="#e1e8dd" stroke="#1B675A" stroke-width="2"/>
    <path d="M302 108V94H359" stroke="#1B675A" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M348 53V79 M333 79H363" stroke="#B54B35" stroke-width="4"/>
    <path d="M373 94c8-20 18 20 26 0s18 20 26 0" stroke="#1B675A" stroke-width="3"/>
    <path d="M549 119H642L664 137 642 155H549Z" fill="#e1e8dd" stroke="#1B675A" stroke-width="2"/>
    <path d="M574 104V86H613" stroke="#1B675A" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M623 86c8-20 18 20 26 0s18 20 26 0" stroke="#1B675A" stroke-width="3"/>
    <path d="M209 111H241 M462 111H494" stroke="#1B675A" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#202722" text-anchor="middle">
    <text x="101" y="200"><tspan x="101">ANKRD11</tspan><tspan x="101" dy="34">condensate</tspan></text>
    <text x="353" y="200"><tspan x="353">Transcriptional</tspan><tspan x="353" dy="34">restraint</tspan></text>
    <text x="610" y="200"><tspan x="610">Controlled</tspan><tspan x="610" dy="34">gene output</tspan></text>
  </g>
</svg>
