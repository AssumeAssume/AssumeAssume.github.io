<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
  <title id="title">ANKRD11 restrains elongation at hypertranscribed genes</title>
  <desc id="desc">A gene with very high transcriptional activity is the focus of this conceptual illustration. Several nascent RNA strands indicate ongoing transcription. An ANKRD11 condensate overlaps the transcribed locus, and a restraint symbol points to the forward transcription-elongation arrow. The number of strands and the size of the condensate are schematic, not quantitative measurements.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 6 4 1 7" fill="none" stroke="#1B675A" stroke-width="1.3"/></marker>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="317" cy="192" rx="217" ry="98" fill="#e9eee5" stroke="#1B675A" stroke-width="2" stroke-dasharray="5 7"/>
    <path d="M220 76V95" stroke="#1B675A" stroke-width="2"/>
    <g fill="#1B675A" stroke="none">
      <circle cx="167" cy="136" r="6"/>
      <circle cx="217" cy="117" r="6"/>
      <circle cx="376" cy="117" r="6"/>
      <circle cx="454" cy="142" r="6"/>
      <circle cx="484" cy="184" r="6"/>
    </g>
    <path d="M24 238H696" stroke="#788679" stroke-width="2"/>
    <path d="M70 222H636L657 238 636 254H70Z" fill="#e1e8dd" stroke="#1B675A" stroke-width="2.5"/>
    <path d="M158 213c-16-12 12-21-2-33s12-21-2-33 M246 213c-16-12 12-21-2-33s12-21-2-33 12-21-2-33 M334 213c-16-12 12-21-2-33s12-21-2-33 12-21-2-33 M422 213c-16-12 12-21-2-33s12-21-2-33 M552 213c-16-12 12-21-2-33" stroke="#1B675A" stroke-width="3.5"/>
    <g fill="#F6F4EE" stroke="#1B675A" stroke-width="3">
      <circle cx="158" cy="221" r="9"/>
      <circle cx="246" cy="221" r="9"/>
      <circle cx="334" cy="221" r="9"/>
      <circle cx="422" cy="221" r="9"/>
      <circle cx="552" cy="221" r="9"/>
    </g>
    <path d="M572 183H653" stroke="#1B675A" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M612 82V159 M590 159H634" stroke="#B54B35" stroke-width="4"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="220" y="31" fill="#1B675A" font-size="32"><tspan x="220">ANKRD11</tspan><tspan x="220" dy="34">condensate</tspan></text>
    <text x="607" y="31" fill="#B54B35" font-size="32"><tspan x="607">Restrains</tspan><tspan x="607" dy="34">elongation</tspan></text>
    <text x="360" y="338" fill="#202722" font-size="38" font-weight="600">Hypertranscribed genes</text>
    <text x="360" y="375" fill="#536057" font-size="28">Very high transcriptional activity</text>
  </g>
</svg>
